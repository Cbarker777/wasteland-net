server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app with no client-side router: every path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames (Vite's assets/*) are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Question-pool diagrams only change when the pool is re-ingested.
    location /figures/ {
        expires 7d;
    }

    # Generated at container start from UMAMI_* env vars; never cache it so
    # turning analytics on or off takes effect on the next page load.
    location = /analytics.js {
        add_header Cache-Control "no-cache";
    }

    # index.html isn't hashed, so never cache it. A redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
